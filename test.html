<!-- Bottom Info Bar -->
<div
    dir="rtl"
    class="mx-8 mb-4
           flex h-[64px] items-center
           overflow-hidden
           rounded-[18px]
           border border-slate-100
           bg-white/95
           shadow-[0_5px_25px_rgba(30,64,175,0.08)]"
>

    <!-- =========================
         تاريخ البداية
    ========================== -->
    <div
        class="flex h-full items-center
               gap-3 px-7
               border-l border-slate-200"
    >

        <!-- Calendar Icon -->
        <div class="text-[#23405C]">
            <svg
                class="h-[22px] w-[22px]"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <rect
                    x="3"
                    y="4"
                    width="18"
                    height="17"
                    rx="2"
                />

                <path d="M16 2v4M8 2v4M3 9h18" />

                <path d="M8 13h2M14 13h2M8 17h2" />
            </svg>
        </div>

        <div class="whitespace-nowrap text-[14px]">
            <span class="font-bold text-[#263B50]">
                تاريخ البداية :
            </span>

            <span class="mr-1 font-medium text-[#53677B]">
                2026-04-27
            </span>
        </div>

    </div>


    <!-- =========================
         تاريخ النهاية
    ========================== -->
    <div
        class="flex h-full items-center
               gap-3 px-7
               border-l border-slate-200"
    >

        <!-- Calendar Icon -->
        <div class="text-[#23405C]">
            <svg
                class="h-[22px] w-[22px]"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
            >
                <rect
                    x="3"
                    y="4"
                    width="18"
                    height="17"
                    rx="2"
                />

                <path d="M16 2v4M8 2v4M3 9h18" />

                <path d="M8 13h2M14 13h2M8 17h2" />
            </svg>
        </div>

        <div class="whitespace-nowrap text-[14px]">
            <span class="font-bold text-[#263B50]">
                تاريخ النهاية :
            </span>

            <span class="mr-1 font-medium text-[#53677B]">
                2027-04-27
            </span>
        </div>

    </div>


    <!-- =========================
         اللغة
    ========================== -->
    <div
        class="flex h-full items-center
               gap-3 px-7
               border-l border-slate-200"
    >

        <!-- Globe -->
        <svg
            class="h-[21px] w-[21px] text-[#29445D]"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
        >
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18" />
            <path
                d="M12 3c3 3.2 3 14.8 0 18
                   M12 3c-3 3.2-3 14.8 0 18"
            />
        </svg>


        <!-- Language Switcher -->
        <div
            class="flex h-[38px]
                   items-center
                   rounded-full
                   bg-[#F4F7FA]
                   p-1"
        >

            <!-- Arabic Active -->
            <button
                class="h-[30px]
                       min-w-[92px]
                       rounded-full
                       bg-[#0FA77C]
                       px-5
                       text-[13px]
                       font-bold
                       text-white
                       shadow-sm"
            >
                العربية
            </button>

            <!-- English -->
            <button
                class="h-[30px]
                       min-w-[72px]
                       rounded-full
                       px-4
                       text-[13px]
                       font-medium
                       text-[#475569]"
            >
                English
            </button>

        </div>

    </div>


    <!-- =========================
         حالة النظام
    ========================== -->
    <div
        class="mr-auto
               flex h-full items-center
               gap-3 px-7"
    >

        <!-- Status Dot -->
        <span
            class="h-[17px] w-[17px]
                   rounded-full
                   bg-[#12B81A]"
        ></span>

        <span
            class="whitespace-nowrap
                   text-[14px]
                   font-bold
                   text-[#263B50]"
        >
            النظام يعمل بشكل طبيعي
        </span>

    </div>

</div>
