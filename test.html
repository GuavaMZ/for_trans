<!-- =========================
     Hero Banner
========================= -->
<section class="px-7 pt-4" dir="rtl">

    <div
        class="relative h-[158px] w-full overflow-hidden
               rounded-[25px]
               border border-white/80
               bg-gradient-to-l
               from-[#F5FAFF]
               via-[#E8F2FF]
               to-[#547FF5]
               shadow-[0_8px_25px_rgba(37,99,235,0.10)]"
    >

        <!-- =========================
             Background Decorations
        ========================= -->

        <!-- Right soft glow -->
        <div
            class="absolute -right-16 -top-20
                   h-[240px] w-[360px]
                   rounded-full
                   bg-white/60
                   blur-3xl"
        ></div>

        <!-- Center blue glow -->
        <div
            class="absolute left-[35%] top-[-80px]
                   h-[230px] w-[320px]
                   rounded-full
                   bg-[#B9D7FF]/40
                   blur-3xl"
        ></div>

        <!-- Abstract diagonal shape -->
        <div
            class="absolute left-[38%] top-[-80px]
                   h-[260px] w-[420px]
                   rotate-[20deg]
                   bg-white/20
                   blur-[1px]"
        ></div>

        <!-- Small decorative circles -->
        <span
            class="absolute right-[39%] top-[28px]
                   h-3 w-3 rounded-full
                   bg-[#75A7FF]/50"
        ></span>

        <span
            class="absolute right-[43%] bottom-[25px]
                   h-2 w-2 rounded-full
                   bg-[#75A7FF]/40"
        ></span>


        <!-- =========================
             Banner Content
        ========================= -->

        <div
            class="relative z-10 flex h-full
                   items-center"
        >

            <!-- =====================
                 RIGHT SIDE
                 Company Information
            ====================== -->

            <div
                class="flex w-[39%]
                       items-center gap-5
                       pr-10"
            >

                <!-- Company Text -->
                <div class="text-right">

                    <h1
                        class="text-[25px]
                               font-extrabold
                               tracking-[-0.5px]
                               text-[#102A5C]"
                    >
                        شركة إيهاب الحجيري
                    </h1>

                    <p
                        class="mt-1
                               text-[18px]
                               font-medium
                               text-[#60749A]"
                    >
                        فرع الرياض - 2024
                    </p>

                    <!-- Underline -->
                    <div
                        class="mt-4 h-[5px]
                               w-[56px]
                               rounded-full
                               bg-[#2684FF]"
                    ></div>

                </div>


                <!-- =====================
                     Company Logo Space
                ====================== -->

                <div
                    class="flex h-[85px] w-[85px]
                           shrink-0
                           items-center justify-center"
                >
                    <!--
                        ضع اللوجو هنا

                        <img
                            src="/images/logo.png"
                            class="h-[75px] w-[75px] object-contain"
                        />
                    -->
                </div>

            </div>


            <!-- =====================
                 CENTER ILLUSTRATION
            ====================== -->

            <div
                class="relative flex h-full
                       flex-1
                       items-center
                       justify-center"
            >

                <!-- Illustration container -->
                <div
                    class="relative h-[135px] w-[300px]"
                >

                    <!-- Laptop / illustration goes here -->

                    <!--
                    <img
                        src="/images/banner-illustration.png"
                        class="absolute inset-0
                               h-full w-full
                               object-contain"
                    />
                    -->

                    <!-- Temporary abstract laptop -->
                    <div
                        class="absolute left-[80px] top-[20px]
                               h-[72px] w-[130px]
                               rotate-[8deg]
                               rounded-[8px]
                               border-[6px]
                               border-[#284CBB]
                               bg-white
                               shadow-[0_8px_15px_rgba(30,64,175,0.20)]"
                    >

                        <div
                            class="absolute inset-[8px]
                                   rounded-[3px]
                                   bg-gradient-to-br
                                   from-[#E8F3FF]
                                   to-[#C8DDFF]"
                        >

                            <!-- Fake chart -->
                            <div
                                class="absolute bottom-3 left-3
                                       flex items-end gap-1"
                            >
                                <span class="h-5 w-2 rounded-t bg-[#5792F5]"></span>
                                <span class="h-8 w-2 rounded-t bg-[#3B73E8]"></span>
                                <span class="h-6 w-2 rounded-t bg-[#75A7FF]"></span>
                                <span class="h-11 w-2 rounded-t bg-[#2563EB]"></span>
                            </div>

                            <!-- Fake lines -->
                            <div
                                class="absolute right-3 top-3 space-y-1"
                            >
                                <span class="block h-1 w-10 rounded bg-[#9DBBF0]"></span>
                                <span class="block h-1 w-7 rounded bg-[#B4C9ED]"></span>
                                <span class="block h-1 w-9 rounded bg-[#B4C9ED]"></span>
                            </div>

                        </div>

                    </div>

                    <!-- Laptop base -->
                    <div
                        class="absolute left-[62px] top-[91px]
                               h-[8px] w-[170px]
                               rotate-[8deg]
                               rounded-full
                               bg-[#3158C4]"
                    ></div>


                    <!-- Small plant -->
                    <div
                        class="absolute bottom-[28px]
                               left-[20px]"
                    >

                        <!-- Pot -->
                        <div
                            class="h-[24px] w-[30px]
                                   rounded-b-[8px]
                                   bg-gradient-to-b
                                   from-[#8C6BE8]
                                   to-[#5140B5]"
                        ></div>

                        <!-- Stem -->
                        <div
                            class="absolute bottom-[18px]
                                   left-[14px]
                                   h-[45px] w-[2px]
                                   bg-[#438B61]"
                        ></div>

                        <!-- Leaves -->
                        <div
                            class="absolute bottom-[45px]
                                   left-[4px]
                                   h-[18px] w-[10px]
                                   rotate-[-35deg]
                                   rounded-full
                                   bg-[#52A56E]"
                        ></div>

                        <div
                            class="absolute bottom-[52px]
                                   left-[15px]
                                   h-[19px] w-[10px]
                                   rotate-[25deg]
                                   rounded-full
                                   bg-[#65B87B]"
                        ></div>

                    </div>

                </div>

            </div>


            <!-- =====================
                 LEFT SIDE
                 Slogan
            ====================== -->

            <div
                class="flex w-[32%]
                       items-center
                       justify-center
                       pl-8"
            >

                <div class="text-center">

                    <div
                        class="text-[27px]
                               font-medium
                               tracking-wide
                               text-white
                               drop-shadow-[0_2px_4px_rgba(0,0,0,0.12)]"
                    >
                        معًا .. نحو إدارة أسهل
                    </div>

                    <!-- Handwritten-style underline -->
                    <div
                        class="relative mx-auto mt-3
                               h-[3px] w-[235px]
                               rotate-[-5deg]
                               rounded-full
                               bg-white"
                    >
                        <span
                            class="absolute -right-1 -top-[3px]
                                   h-[8px] w-[8px]
                                   rotate-45
                                   bg-white"
                        ></span>
                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
